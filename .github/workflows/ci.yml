name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run python -m build
      - run: uv venv /tmp/panoptic-wheel
      - run: uv pip install --python /tmp/panoptic-wheel/bin/python dist/*.whl
      - run: /tmp/panoptic-wheel/bin/python -c "import panoptic_segmenter; print(panoptic_segmenter.__version__)"
      - run: cd /tmp && /tmp/panoptic-wheel/bin/panoptic-segment show-config --set run_name=wheel-smoke
