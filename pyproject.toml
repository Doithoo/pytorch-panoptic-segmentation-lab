[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-panoptic-segmentation-lab"
version = "0.1.0"
description = "Beginner-oriented reproducible PyTorch panoptic segmentation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yashowhoo" }]
keywords = ["pytorch", "panoptic-segmentation", "computer-vision", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "numpy>=1.24,<3",
    "pillow>=10,<13",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "mypy>=1.15,<3",
    "types-PyYAML>=6,<7",
    "build>=1.2,<2",
]
plot = ["matplotlib>=3.6,<4"]

[project.urls]
Homepage = "https://github.com/Doithoo/pytorch-panoptic-segmentation-lab"
Repository = "https://github.com/Doithoo/pytorch-panoptic-segmentation-lab"
Documentation = "https://github.com/Doithoo/pytorch-panoptic-segmentation-lab#readme"

[project.scripts]
panoptic-segment = "panoptic_segmenter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panoptic_segmenter = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "examples"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
